name: NodeSeek 破云关键词监控

on:
  schedule:
    # GitHub Actions 支持的最短定时周期：每 5 分钟检查一次
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "发送测试邮件（首次配置完 Secrets 后勾选此项测试收信）"
        required: false
        default: false
        type: boolean
      keywords:
        description: "标题关键词（多个用英文逗号分隔）"
        required: false
        default: "破云"
        type: string

concurrency:
  group: nodeseek-poyun-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NodeSeek RSS Monitor
        env:
          KEYWORDS: ${{ inputs.keywords || vars.KEYWORDS || '破云' }}
          EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS || '' }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email && 'true' || 'false' }}
          STATE_FILE: seen_ids.json
        run: python3 monitor.py

      - name: Persist seen post IDs on new match
        run: |
          if ! git diff --quiet seen_ids.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_ids.json
            git commit -m "chore(state): record notified post IDs [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "状态文件无变更，无需提交。"
          fi
